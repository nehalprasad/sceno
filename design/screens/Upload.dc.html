<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Upload</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@600;700&amp;family=Inter:wght@400;500;600&amp;display=swap">
<style>body{margin:0}</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: #FBF6EE; color: #2A1A14; font-family: Inter, sans-serif; display: flex; flex-direction: column; padding: 20px">
  <div style="display: flex; justify-content: space-between; align-items: center">
    <a href="Main.dc.html" style="height: 44px; display: flex; align-items: center; font-size: 14px; font-weight: 600; color: #2A1A14; text-decoration: none">Cancel</a>
    <button aria-label="Language: English" style="height: 36px; padding: 0 12px; border-radius: 999px; border: 1px solid #D8CBBB; background: #FFFDF8; font: 600 13px Inter, sans-serif; color: #2A1A14">EN</button>
  </div>
  <h1 style="margin: 4px 0 6px; font-family: 'Cormorant Garamond', serif; font-size: 34px">24 photos selected</h1>
  <p style="margin: 0 0 18px; font-size: 14px; color: #6B5A50; line-height: 1.5">We sorted them by the time they were taken. Tap an event to change it.</p>

  <div style="display: flex; flex-direction: column; gap: 12px">
    <div style="padding: 14px; border-radius: 16px; background: #FFFDF8; border: 1px solid #E4D8C8; display: flex; flex-direction: column; gap: 10px">
      <div style="display: flex; justify-content: space-between; align-items: center">
        <span style="font-weight: 600">Haldi · 16 photos</span>
        <button style="height: 36px; padding: 0 12px; border-radius: 999px; border: 1px solid #D8CBBB; background: transparent; font: 500 13px Inter, sans-serif; color: #2A1A14">Change</button>
      </div>
      <div style="display: grid; grid-template-columns: repeat(6, minmax(0, 1fr)); gap: 4px">
        <div style="aspect-ratio: 1; border-radius: 4px; background: #F2C14E"></div>
        <div style="aspect-ratio: 1; border-radius: 4px; background: #E9A21B"></div>
        <div style="aspect-ratio: 1; border-radius: 4px; background: #D9892B"></div>
        <div style="aspect-ratio: 1; border-radius: 4px; background: #EFD28A"></div>
        <div style="aspect-ratio: 1; border-radius: 4px; background: #C77A23"></div>
        <div style="aspect-ratio: 1; border-radius: 4px; background: #2A1A14; color: #FBF6EE; font-size: 12px; display: flex; align-items: center; justify-content: center">+11</div>
      </div>
    </div>
    <div style="padding: 14px; border-radius: 16px; background: #FFFDF8; border: 1px solid #E4D8C8; display: flex; flex-direction: column; gap: 10px">
      <div style="display: flex; justify-content: space-between; align-items: center">
        <span style="font-weight: 600">Mehendi · 6 photos</span>
        <button style="height: 36px; padding: 0 12px; border-radius: 999px; border: 1px solid #D8CBBB; background: transparent; font: 500 13px Inter, sans-serif; color: #2A1A14">Change</button>
      </div>
      <div style="display: grid; grid-template-columns: repeat(6, minmax(0, 1fr)); gap: 4px">
        <div style="aspect-ratio: 1; border-radius: 4px; background: #7E9B5B"></div>
        <div style="aspect-ratio: 1; border-radius: 4px; background: #5F7D45"></div>
        <div style="aspect-ratio: 1; border-radius: 4px; background: #A3B57A"></div>
        <div style="aspect-ratio: 1; border-radius: 4px; background: #7E9B5B"></div>
        <div style="aspect-ratio: 1; border-radius: 4px; background: #5F7D45"></div>
        <div style="aspect-ratio: 1; border-radius: 4px; background: #A3B57A"></div>
      </div>
    </div>
    <div style="padding: 14px; border-radius: 16px; background: #FFF4E5; border: 1px solid #E9C48A; display: flex; justify-content: space-between; align-items: center; gap: 10px">
      <span style="font-size: 14px; line-height: 1.4"><strong>2 photos</strong> have no time. Pick their event.</span>
      <button style="height: 40px; padding: 0 14px; border-radius: 999px; border: 0; background: #2A1A14; color: #FBF6EE; font: 600 13px Inter, sans-serif">Pick</button>
    </div>
  </div>

  <div style="margin-top: auto; display: flex; flex-direction: column; gap: 10px">
    <span style="font-size: 13px; color: #6B5A50; text-align: center">Weak signal? Photos upload in the background and retry.</span>
    <button style="height: 54px; border-radius: 999px; border: 0; background: #7A1E2C; color: #FBF6EE; font: 600 16px Inter, sans-serif">Upload 24 photos</button>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic { renderVals() { return {}; } }
</script>
</body>
</html>
